name: academy-security-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy_scope_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_scope_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      ACADEMY_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/academy_scope_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
